name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_portable:
        description: Build and smoke-test the portable candidate
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser-runtime
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install Chromium for isolated HTML tests
        run: python -m playwright install chromium
      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v

  portable:
    # This development branch has not passed actual 4B end-to-end acceptance.
    # The old portable job checks the 0.5B assistant only and cannot qualify it.
    # Restore a build job with pinned 4B assets and operator acceptance before release.
    if: ${{ false }}
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Build a fresh portable candidate
        run: |
          python tools/prepare_local_ai.py --cache "$env:RUNNER_TEMP/ai-cache" --output local-ai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build.py --install-browser --output dist/DeepSeekQuotaManager-win-x64
      - name: Smoke-test without a platform account
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('portable-evidence-' + [guid]::NewGuid())
          python tools/verify_portable_candidate.py --bundle dist/DeepSeekQuotaManager-win-x64 --evidence "$evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $evidence 'portable-acceptance.json') -Destination dist/portable-acceptance.json
      - name: Package candidate and checksum
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist/DeepSeekQuotaManager-win-x64'
          $unexpected = Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object {
            $_.Name -match '^(管理设置\.json|人员额度\.xlsx|状态\.db(?:-.*)?|\.运行锁|\.初始化中|browser-smoke\.json)$' -or
            $_.Name -match '^运行(日志|摘要)-'
          }
          if ($unexpected) { throw 'Application data found in the portable directory.' }
          $archive = Join-Path $PWD 'dist/DeepSeekQuotaManager-windows-x64.zip'
          Compress-Archive -LiteralPath $bundle -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeepSeekQuotaManager-windows-x64.zip" | Set-Content -LiteralPath ($archive + '.sha256') -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DeepSeekQuotaManager-windows-x64-candidate
          path: |
            dist/*.zip
            dist/*.sha256
            dist/portable-acceptance.json
          if-no-files-found: error
          retention-days: 14
